// Top-level build file where you can add configuration options common to all sub-projects/modules.

apply from: "variables.gradle"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

gradle.taskGraph.whenReady { taskGraph ->
    taskGraph.allTasks.each { task ->
        if (task.name.contains("compile")) {
            def licenseDir = new File(System.getProperty("user.home"), "android-sdk/licenses")
            if (!licenseDir.exists()) licenseDir.mkdirs()
            new File(licenseDir, "android-sdk-license").text = "893348b14efc5f34a9113696a90467574456758\n24333f1a50b34c9b16a747d7a547e0763c9c3260\nd56f5187479451e40a6f337d21a147f8732d56a3\n84815b1f8b31920d393078d7ff67c06b2566d19\n659f81f794344243a4e9bca9a5f4c58cf341ee"
        }
    }
}
